<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새 스프레드 만들기 · 타로 스프레드 아카이브</title>
  <script>
    (function () {
      var stored = localStorage.getItem("tarot-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="../index.html">타로 스프레드<span class="accent-dot">.</span></a>
      <div class="header-actions">
        <span id="admin-status" class="admin-status"></span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환"></button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumb"><a href="../index.html">스프레드 목록</a> /</div>
    <h1 class="page-title">새 스프레드 만들기</h1>
    <p class="page-subtitle">질문과, 카드를 배열할 자리(포지션)별 의미를 정의합니다.</p>

    <div id="form-alert"></div>

    <form id="spread-form">
      <div class="form-group">
        <label for="question-input">질문 (기본 표시명)</label>
        <input type="text" id="question-input" required placeholder="예: 이 인물은 어떤 성격인가?" />
      </div>

      <div class="form-group">
        <label for="custom-name-input">스프레드 이름 (선택)</label>
        <input type="text" id="custom-name-input" placeholder="예: 성격 분석 스프레드" />
        <p class="form-hint">비워두면 질문이 목록에 그대로 표시됩니다.</p>
      </div>

      <div class="form-group">
        <label for="description-input">설명 (선택)</label>
        <textarea id="description-input" placeholder="이 스프레드에 대한 간단한 설명"></textarea>
      </div>

      <div class="form-group">
        <label>자리(포지션) 구성</label>
        <div id="positions-editor"></div>
        <button type="button" id="add-position-btn" class="btn btn-secondary">+ 자리 추가</button>
      </div>

      <button type="submit" class="btn" id="submit-btn">스프레드 저장</button>
    </form>
  </main>

  <p class="footer-note">타로 스프레드 아카이브 · 정적 사이트</p>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/github-api.js"></script>
  <script src="../assets/js/page-admin-spread-new.js"></script>
</body>
</html>
