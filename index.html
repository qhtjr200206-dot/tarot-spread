<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타로 스프레드 아카이브</title>
  <script>
    (function () {
      var stored = localStorage.getItem("tarot-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/theme.css" />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="./index.html">타로 스프레드<span class="accent-dot">.</span></a>
      <div class="header-actions">
        <span id="admin-status" class="admin-status"></span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환"></button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">스프레드 목록</h1>
    <p class="page-subtitle">질문을 클릭하면 그동안 기록된 리딩을 확인할 수 있습니다.</p>

    <div class="section-heading">
      <h2 style="visibility:hidden;position:absolute;">스프레드</h2>
      <a id="new-spread-link" class="btn" href="./admin/spread-new.html" data-admin-only style="display:none;">+ 새 스프레드</a>
    </div>

    <div id="spread-list" class="card-list">
      <p class="skeleton-text">불러오는 중...</p>
    </div>
  </main>

  <p class="footer-note">타로 스프레드 아카이브 · 정적 사이트</p>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/theme.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/page-home.js"></script>
</body>
</html>
