<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스프레드 상세 · 타로 스프레드 아카이브</title>
  <script>
    (function () {
      var stored = localStorage.getItem("tarot-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/theme.css" />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="./index.html">타로 스프레드<span class="accent-dot">.</span></a>
      <div class="header-actions">
        <span id="admin-status" class="admin-status"></span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환"></button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumb"><a href="./index.html">스프레드 목록</a> /</div>
    <div class="section-heading">
      <div id="spread-header">
        <p class="skeleton-text">불러오는 중...</p>
      </div>
      <a id="edit-spread-link" class="btn btn-secondary" href="#" data-admin-only style="display:none;">✏️ 스프레드 수정</a>
    </div>

    <div class="section">
      <div class="section-heading">
        <h2>자리별 의미</h2>
      </div>
      <div id="positions-table-wrap"></div>
    </div>

    <div class="section">
      <div class="section-heading">
        <h2>리딩 기록</h2>
        <a id="new-reading-link" class="btn" href="#" data-admin-only style="display:none;">+ 리딩 추가</a>
      </div>
      <div id="reading-list" class="card-list"></div>
    </div>
  </main>

  <p class="footer-note">타로 스프레드 아카이브 · 정적 사이트</p>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/theme.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/page-spread.js"></script>
</body>
</html>
